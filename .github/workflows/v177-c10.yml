name: JLPT N1 v177 C10 verification
on:
  push:
    branches: [work/v177-c10-pos-followups]
    paths:
      - 'completion/v177-work/**'
      - 'completion/v177-*'
      - 'completion/C10-followup-364-416-20261113.md'
      - 'JLPT_N1_v177_audit.md'
      - '.github/workflows/v177-c10.yml'
      - 'README.md'
      - 'PROJECT_STATUS.md'
      - 'completion/BACKLOG.md'
      - 'completion/review-register.csv'
permissions:
  contents: write
concurrency:
  group: jlpt-n1-v177-c10
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Save verified v177')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v177-c10-pos-followups
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts
        run: |
          python3 -m py_compile completion/v177-work/prepare.py completion/v177-work/finalize-evidence.py completion/v177-work/write-docs.py completion/v177-work/publish-main.py
          node --check completion/v177-work/browser.cjs
      - name: Reproduce v177 from exact v176 baseline
        run: python3 completion/v177-work/prepare.py
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify cards, reading pools, pairs and progress
        run: node completion/v177-work/browser.cjs
      - name: Finalize author acceptance and registries
        run: python3 completion/v177-work/finalize-evidence.py
      - name: Update audit and project status
        run: python3 completion/v177-work/write-docs.py
      - name: Save verified v177 checkpoint and evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions@users.noreply.github.com"
          git add JLPT_N1_ukrainian_reading_v177.html JLPT_N1_v177_audit.md README.md PROJECT_STATUS.md completion/BACKLOG.md completion/review-register.csv completion/v177-acceptance.tsv completion/v177-pair-review.tsv completion/C10-followup-364-416-20261113.md completion/v177-work/candidate.json completion/v177-work/prepare-results.json completion/v177-work/browser-results.json completion/v177-work/registry-results.json
          if ! git diff --cached --quiet; then
            git commit -m "Save verified v177 C10 checkpoint and evidence"
            git push origin HEAD:work/v177-c10-pos-followups
          fi
      - name: Publish verified v177 release to main
        if: success() && hashFiles('completion/v177-work/PUBLISH') != ''
        run: python3 completion/v177-work/publish-main.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v177-c10-audit-evidence
          path: |
            JLPT_N1_ukrainian_reading_v177.html
            JLPT_N1_v177_audit.md
            completion/v177-work/prepare-results.json
            completion/v177-work/browser-results.json
            completion/v177-work/registry-results.json
            completion/v177-acceptance.tsv
            completion/v177-pair-review.tsv
          if-no-files-found: warn
