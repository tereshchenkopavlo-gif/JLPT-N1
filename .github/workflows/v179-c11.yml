name: JLPT N1 v179 C11 reading diagnostics
on:
  push:
    branches: [work/v179-c11-reading-diagnostics]
    paths:
      - 'completion/v179-work/**'
      - '.github/workflows/v179-c11.yml'
permissions:
  contents: write
concurrency:
  group: jlpt-n1-v179-c11
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Save v179 C11 diagnostic evidence')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v179-c11-reading-diagnostics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: node --check completion/v179-work/diagnose-reading.cjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Diagnose exact reading pools without changing data
        run: node completion/v179-work/diagnose-reading.cjs
      - name: Save diagnostic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions@users.noreply.github.com"
          git add completion/v179-work/diagnostics.json completion/v179-work/proposals.tsv completion/v179-work/diagnostics.md
          git commit -m "Save v179 C11 diagnostic evidence"
          git push origin HEAD:work/v179-c11-reading-diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v179-c11-reading-diagnostics
          path: completion/v179-work/diagnostics.*
            completion/v179-work/proposals.tsv
          if-no-files-found: warn
