name: Verify and publish JLPT N1 v150
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit150/**'
      - '.github/workflows/v150-publish.yml'
permissions:
  contents: write
concurrency:
  group: jlpt-v150-release
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact release and verify all authorized changes
        run: |
          git fetch --depth=1 origin f8e4cc250c52eb1e04d42b4339d478429ad8e896
          python3 audit150/build.py
          python3 audit150/check.py
          python3 audit150/coverage.py
          node --check audit150/app.js
      - name: Prepare Chromium and Japanese font
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify new grammar contexts and prior saved sets
        run: |
          node audit150/meaning-browser.cjs
          node audit150/coverage-browser.cjs
          node audit150/scope-browser.cjs
          node audit150/vocab-browser.cjs
      - name: Verify presentation, navigation, persistence and complete session
        run: |
          node audit150/presentation.cjs
          node audit150/ui.cjs
          node audit150/browser-functional.cjs
          node audit150/session-completion.cjs
          node audit150/comparison-browser.cjs
      - name: Publish complete HTML, audit and feedback evidence
        run: |
          python3 audit150/publish.py
          python3 audit150/check.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JLPT_N1_ukrainian_reading_v150.html JLPT_N1_v150_audit.md README.md PROJECT_STATUS.md completion/BACKLOG.md completion/C10-C18-v150-result.json audit150/build-summary.json audit150/editorial-review.json audit150/provenance.json audit150/grammar-coverage.json audit150/*-results.json completion/review-register.csv
          git commit -m "Release JLPT N1 v150: audit first 30 vocabulary cards; retain all 547 prior author credits"
          git push origin HEAD:main
      - name: Verify published full release
        run: |
          git fetch origin main
          for file in JLPT_N1_ukrainian_reading_v150.html JLPT_N1_v150_audit.md README.md PROJECT_STATUS.md completion/BACKLOG.md completion/C10-C18-v150-result.json completion/review-register.csv; do
            test "$(git hash-object "$file")" = "$(git rev-parse "origin/main:$file")"
          done
