name: C12 batch 25 browser
on:
  push:
    branches: [work/c12-batch25-checkpoint]
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 completion/c12-batch25/build-candidate.py
      - run: node completion/c12-batch25/browser.cjs
      - run: |
          f=JLPT_N1_ukrainian_reading_v229_C12aa.html
          a=JLPT_N1_v229_C12aa_audit.md
          candidate=completion/c12-batch25/JLPT_N1_C12_candidate_UNACCEPTED.html
          echo "1bdbe4f7c02384807465edb8141e3602ff4b4481dab884c0732bebe2a8e35195  $candidate" | sha256sum -c -
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = '1709287807f1a9e5d8c1fa2af077eb9325d53409'
          dest="$RUNNER_TEMP/release"
          git worktree add --detach "$dest" FETCH_HEAD
          mkdir -p "$dest/completion/c12-batch25"
          cp "$candidate" "$dest/$f"
          cp completion/c12-batch25/{drafts.json,build-candidate.py,browser.cjs,record-release.py,checkpoint.md,browser-results.json,integration-results.json} "$dest/completion/c12-batch25/"
          cd "$dest"
          cat > "$a" <<'EOF'
          # v229-C12aa · партія 25 — 26 листопада 2026

          Додано 「音のしない時間を記録する」, повний український переклад і три питання. Банк містить 120 середніх і 79 довгих текстів. До цілі C12 залишився один довгий текст. Основний реєстр — 5982 позиції, словниковий аудит — 3897/3914.

          Авторський перегляд охопив зміст, переклад, ключі, альтернативи та буквальні опори. Збірка перевірила синтаксис JS, попередні тексти й побайтовий відкат. Chromium перевірив відображення, ключі й пояснення на 360, 412 і 1280 px.  Незалежне мовне приймання цієї партії та перевірка на фізичних пристроях відкриті.

          SHA-256 HTML `1bdbe4f7c02384807465edb8141e3602ff4b4481dab884c0732bebe2a8e35195`. Основа `1709287807f1a9e5d8c1fa2af077eb9325d53409`.
          EOF
          printf '\n[Журнал перевірок](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$a"
          cp "$a" completion/c12-batch25/acceptance.md
          python3 completion/c12-batch25/record-release.py
          printf '\nПоточний випуск C12 — [повний HTML](./%s) і [звіт](./%s).\n' "$f" "$a" >> README.md
          git add -- "$f" "$a" README.md PROJECT_STATUS.md completion/BACKLOG.md completion/review-register.csv completion/c12-batch25
          git diff --cached --check -- . ":(exclude)$f"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Release verified C12 batch 25'
          git push origin HEAD:refs/heads/main
