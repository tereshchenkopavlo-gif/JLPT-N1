name: IR02-IR07 adjudication browser diagnostics
on:
  push:
    branches: [work/ir02-ir07-adjudication]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 completion/independent/adjudicate-ir02-ir07.py
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - run: node completion/independent/browser-ir02-ir07.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IR02-IR07-browser-evidence
          path: |
            completion/independent/adjudications/20261121/browser-results.json
            completion/independent/adjudications/20261121/candidate-validation.json
