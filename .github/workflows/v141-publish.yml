name: Verify and publish JLPT N1 v141
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit141/**'
      - '.github/workflows/v141-publish.yml'
permissions:
  contents: write
concurrency:
  group: jlpt-v141-release
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact release and verify all authorized changes
        run: |
          python3 audit141/build.py
          python3 audit141/check.py
          node --check audit141/app.js
      - name: Prepare Chromium and Japanese font
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify all saved meaning sets and every current context
        run: node audit141/meaning-browser.cjs
      - name: Verify presentation, navigation, persistence and complete session
        run: |
          node audit141/presentation.cjs
          node audit141/ui.cjs
          node audit141/browser-functional.cjs
          node audit141/session-completion.cjs
          node audit141/comparison-browser.cjs
      - name: Publish complete HTML, audit and feedback evidence
        run: |
          python3 audit141/publish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JLPT_N1_ukrainian_reading_v141.html JLPT_N1_v141_audit.md README.md PROJECT_STATUS.md completion/BACKLOG.md completion/review-register.csv completion/reconciled-v141.json completion/C11-saved-sets-result.json audit141/build-summary.json audit141/editorial-review.json audit141/provenance.json audit141/*-results.json
          git commit -m "Release JLPT N1 v141: audit 265 saved meaning sets, revise 12 context-bound quizzes"
          git push origin HEAD:main
      - name: Verify published full release
        run: |
          git fetch origin main
          for file in JLPT_N1_ukrainian_reading_v141.html JLPT_N1_v141_audit.md README.md PROJECT_STATUS.md completion/BACKLOG.md completion/review-register.csv completion/reconciled-v141.json completion/C11-saved-sets-result.json; do
            test "$(git hash-object "$file")" = "$(git rev-parse "origin/main:$file")"
          done
