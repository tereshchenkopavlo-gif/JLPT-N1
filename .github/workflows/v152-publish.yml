name: Verify and publish JLPT N1 v152
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit152/**'
      - '.github/workflows/v152-publish.yml'
permissions:
  contents: write
concurrency:
  group: jlpt-v152-release
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact release and verify all authorized changes
        run: |
          git fetch --depth=1 origin 55947ca87253e033a39c0258ab1fd50eddd046b6
          python3 audit152/build.py
          python3 audit152/check.py
          python3 audit152/coverage.py
          node --check audit152/app.js
      - name: Prepare Chromium and Japanese font
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify new grammar contexts and prior saved sets
        run: |
          node audit152/meaning-browser.cjs
          node audit152/coverage-browser.cjs
          node audit152/scope-browser.cjs
          node audit152/vocab-browser.cjs
      - name: Verify presentation, navigation, persistence and complete session
        run: |
          node audit152/presentation.cjs
          node audit152/ui.cjs
          node audit152/browser-functional.cjs
          node audit152/session-completion.cjs
          node audit152/comparison-browser.cjs
      - name: Publish complete HTML, audit and feedback evidence
        run: |
          python3 audit152/publish.py
          python3 audit152/check.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JLPT_N1_ukrainian_reading_v152.html JLPT_N1_v152_audit.md README.md PROJECT_STATUS.md completion/BACKLOG.md completion/C10-C18-v152-result.json audit152/build-summary.json audit152/editorial-review.json audit152/provenance.json audit152/grammar-coverage.json audit152/*-results.json completion/review-register.csv
          git commit -m "Release JLPT N1 v152: audit vocabulary cards 61–120; retain all 607 prior author credits"
          git push origin HEAD:main
      - name: Verify published full release
        run: |
          git fetch origin main
          for file in JLPT_N1_ukrainian_reading_v152.html JLPT_N1_v152_audit.md README.md PROJECT_STATUS.md completion/BACKLOG.md completion/C10-C18-v152-result.json completion/review-register.csv; do
            test "$(git hash-object "$file")" = "$(git rev-parse "origin/main:$file")"
          done
