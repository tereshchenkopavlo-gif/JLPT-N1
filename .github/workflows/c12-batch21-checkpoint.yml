name: C12 batch 21 browser
on:
  push:
    branches: [work/c12-batch21-checkpoint]
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 completion/c12-batch21/build-candidate.py
      - run: node completion/c12-batch21/browser.cjs
      - run: |
          f=JLPT_N1_ukrainian_reading_v229_C12w.html
          a=JLPT_N1_v229_C12w_audit.md
          candidate=completion/c12-batch21/JLPT_N1_C12_candidate_UNACCEPTED.html
          echo "8359509e1bb208ff73e170edabaa15e86ee4fee3ccddc57c36e58a182c6949a1  $candidate" | sha256sum -c -
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = '4db09a3a02e8aef4bb54db227220b756e8ce5d2f'
          dest="$RUNNER_TEMP/release"
          git worktree add --detach "$dest" FETCH_HEAD
          mkdir -p "$dest/completion/c12-batch21"
          cp "$candidate" "$dest/$f"
          cp completion/c12-batch21/{drafts.json,build-candidate.py,browser.cjs,record-release.py,checkpoint.md,browser-results.json,integration-results.json} "$dest/completion/c12-batch21/"
          cd "$dest"
          cat > "$a" <<'EOF'
          # v229-C12w · партія 21 — 25 листопада 2026

          Додано 「書き込める場所を変える」, повний український переклад і три питання. Банк містить 120 середніх і 75 довгих текстів. До цілі C12 залишилося п’ять довгих текстів. Основний реєстр — 5966 позицій, словниковий аудит — 3897/3914.

          Авторський перегляд охопив зміст, переклад, ключі, альтернативи та буквальні опори. Збірка перевірила синтаксис JS, попередні тексти й побайтовий відкат. Chromium перевірив відображення, ключі й пояснення на 360, 412 і 1280 px. Незалежне мовне та фізичне приймання відкриті.

          SHA-256 HTML `8359509e1bb208ff73e170edabaa15e86ee4fee3ccddc57c36e58a182c6949a1`. Основа `4db09a3a02e8aef4bb54db227220b756e8ce5d2f`.
          EOF
          printf '\n[Журнал перевірок](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$a"
          cp "$a" completion/c12-batch21/acceptance.md
          python3 completion/c12-batch21/record-release.py
          printf '\nПоточний випуск C12 — [повний HTML](./%s) і [звіт](./%s).\n' "$f" "$a" >> README.md
          git add -- "$f" "$a" README.md PROJECT_STATUS.md completion/BACKLOG.md completion/review-register.csv completion/c12-batch21
          git diff --cached --check -- . ":(exclude)$f"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Release verified C12 batch 21'
          git push origin HEAD:refs/heads/main
