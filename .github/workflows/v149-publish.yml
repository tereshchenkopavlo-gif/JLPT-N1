name: Verify and publish JLPT N1 v149
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit149/**'
      - '.github/workflows/v149-publish.yml'
permissions:
  contents: write
concurrency:
  group: jlpt-v149-release
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact release and verify all authorized changes
        run: |
          git fetch --depth=1 origin e744124eed9f0eec636150943209b5d6dce90407
          python3 audit149/build.py
          python3 audit149/check.py
          python3 audit149/coverage.py
          node --check audit149/app.js
      - name: Prepare Chromium and Japanese font
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify new grammar contexts and prior saved sets
        run: |
          node audit149/meaning-browser.cjs
          node audit149/coverage-browser.cjs
          node audit149/scope-browser.cjs
          node audit149/grammar-browser.cjs
      - name: Verify presentation, navigation, persistence and complete session
        run: |
          node audit149/presentation.cjs
          node audit149/ui.cjs
          node audit149/browser-functional.cjs
          node audit149/session-completion.cjs
          node audit149/comparison-browser.cjs
      - name: Publish complete HTML, audit and feedback evidence
        run: |
          python3 audit149/publish.py
          python3 audit149/check.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JLPT_N1_ukrainian_reading_v149.html JLPT_N1_v149_audit.md README.md PROJECT_STATUS.md completion/BACKLOG.md completion/C10-C18-v149-result.json audit149/build-summary.json audit149/editorial-review.json audit149/provenance.json audit149/grammar-coverage.json audit149/*-results.json completion/review-register.csv
          git commit -m "Release JLPT N1 v149: audit 27 grammar cards and 9 comparisons; retain all 511 prior author credits"
          git push origin HEAD:main
      - name: Verify published full release
        run: |
          git fetch origin main
          for file in JLPT_N1_ukrainian_reading_v149.html JLPT_N1_v149_audit.md README.md PROJECT_STATUS.md completion/BACKLOG.md completion/C10-C18-v149-result.json completion/review-register.csv; do
            test "$(git hash-object "$file")" = "$(git rev-parse "origin/main:$file")"
          done
