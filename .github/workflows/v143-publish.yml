name: Verify and publish JLPT N1 v143
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit143/**'
      - '.github/workflows/v143-publish.yml'
permissions:
  contents: write
concurrency:
  group: jlpt-v143-release
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact release and verify all authorized changes
        run: |
          python3 audit143/build.py
          python3 audit143/check.py
          node --check audit143/app.js
      - name: Prepare Chromium and Japanese font
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify new grammar contexts and prior saved sets
        run: |
          node audit143/meaning-browser.cjs
          node audit143/scope-browser.cjs
          node audit143/grammar-browser.cjs
      - name: Verify presentation, navigation, persistence and complete session
        run: |
          node audit143/presentation.cjs
          node audit143/ui.cjs
          node audit143/browser-functional.cjs
          node audit143/session-completion.cjs
          node audit143/comparison-browser.cjs
      - name: Publish complete HTML, audit and feedback evidence
        run: |
          python3 audit143/publish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JLPT_N1_ukrainian_reading_v143.html JLPT_N1_v143_audit.md README.md PROJECT_STATUS.md completion/BACKLOG.md completion/C11-grammar-v143-result.json audit143/build-summary.json audit143/editorial-review.json audit143/provenance.json audit143/*-results.json
          git commit -m "Release JLPT N1 v143: audit 51 grammar sets /102 contexts; preserve vocabulary sets and prior audit credits"
          git push origin HEAD:main
      - name: Verify published full release
        run: |
          git fetch origin main
          for file in JLPT_N1_ukrainian_reading_v143.html JLPT_N1_v143_audit.md README.md PROJECT_STATUS.md completion/BACKLOG.md completion/C11-grammar-v143-result.json; do
            test "$(git hash-object "$file")" = "$(git rev-parse "origin/main:$file")"
          done
