name: JLPT N1 v171 grammar-order verification
on:
  push:
    branches: [work/v171-grammar-order-checkpoint, work/v172-c10-followups, work/v173-c10-3761-3764, work/v174-c10-remaining-open-ids]
    paths:
      - 'completion/v171-work/prepare-checkpoint.py'
      - 'completion/v171-work/grammar-order-browser.cjs'
      - 'completion/v171-work/publish-main.py'
      - 'completion/v171-work/JLPT_N1_v171_audit.md'
      - 'completion/v171-work/README.md'
      - 'completion/v171-work/PUBLISH'
      - 'PROJECT_STATUS.md'
      - 'completion/BACKLOG.md'
      - 'README.md'
      - 'completion/review-register.csv'
      - 'completion/feedback-20261112-grammar.md'
      - 'completion/v172-work/apply.py'
      - 'completion/v172-work/browser.cjs'
      - 'completion/v172-work/finalize-evidence.py'
      - 'completion/v172-work/publish-main.py'
      - 'completion/v172-work/updates.json'
      - 'completion/v172-work/inspect-targets.py'
      - 'completion/v172-work/PUBLISH'
      - 'completion/v172-work/README.md'
      - '.github/workflows/v172-c10.yml'
      - 'completion/C10-followup-3701-3716-20261112.md'
      - 'completion/C10-followup-3723-3739-20261112.md'
      - 'completion/C10-followup-3742-3757-20261112.md'
      - 'completion/v173-work/**'
      - 'completion/v174-work/**'
      - 'completion/v174-*'
      - 'completion/C10-followup-3820-3900-20261113.md'
      - 'JLPT_N1_v174_audit.md'
      - 'completion/v173-*'
      - 'completion/C10-followup-3761-3764-20261113.md'
      - 'JLPT_N1_v173_audit.md'
      - '.github/workflows/v173-c10.yml'
  pull_request:
    branches: [main]
    paths:
      - 'completion/v171-work/prepare-checkpoint.py'
      - 'completion/v171-work/grammar-order-browser.cjs'
      - 'completion/v171-work/publish-main.py'
      - 'completion/v171-work/JLPT_N1_v171_audit.md'
      - 'completion/v171-work/README.md'
      - 'completion/v171-work/PUBLISH'
      - 'PROJECT_STATUS.md'
      - 'completion/BACKLOG.md'
      - 'README.md'
      - 'completion/review-register.csv'
      - 'completion/feedback-20261112-grammar.md'
      - 'completion/v172-work/**'
      - 'completion/v174-work/**'
      - 'completion/v174-*'
      - 'completion/C10-followup-3820-3900-20261113.md'
      - 'JLPT_N1_v174_audit.md'
      - '.github/workflows/v172-c10.yml'
      - 'completion/C10-followup-3701-3716-20261112.md'
      - 'completion/C10-followup-3723-3739-20261112.md'
      - 'completion/C10-followup-3742-3757-20261112.md'
permissions:
  contents: write
concurrency:
  group: jlpt-n1-v171-grammar-order
  cancel-in-progress: false
jobs:
  verify:
    if: (github.event_name == 'push' && github.ref_name == 'work/v171-grammar-order-checkpoint') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'work/v171-grammar-order-checkpoint')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v171-grammar-order-checkpoint
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce v171 from exact v170 baseline
        run: python3 completion/v171-work/prepare-checkpoint.py
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify all grammar display paths
        run: node completion/v171-work/grammar-order-browser.cjs
      - name: Save full checkpoint and evidence in work branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions@users.noreply.github.com"
          git add JLPT_N1_v171_checkpoint.html completion/v171-work/prepare-results.json completion/v171-work/grammar-order-results.json
          if ! git diff --cached --quiet; then
            git commit -m "Save verified v171 grammar-order checkpoint"
            git push origin HEAD:work/v171-grammar-order-checkpoint
          fi
      - name: Publish verified v171 release to main
        if: success() && github.event_name == 'pull_request' && hashFiles('completion/v171-work/PUBLISH') != ''
        run: python3 completion/v171-work/publish-main.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v171-grammar-order-evidence
          path: |
            completion/v171-work/prepare-results.json
            completion/v171-work/grammar-order-results.json
            JLPT_N1_v171_checkpoint.html
          if-no-files-found: error
  verify-v172:
    if: (github.event_name == 'push' && github.ref_name == 'work/v172-c10-followups') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'work/v172-c10-followups')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v172-c10-followups
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact C10 corrections to v171 baseline
        run: python3 completion/v172-work/apply.py
      - name: Check test and evidence scripts
        run: |
          python3 -m py_compile completion/v172-work/apply.py completion/v172-work/finalize-evidence.py completion/v172-work/publish-main.py
          node --check completion/v172-work/browser.cjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify corrected cards, POS filter, quiz eligibility and progress
        run: node completion/v172-work/browser.cjs
      - name: Finalize author acceptance and pair-review evidence
        run: python3 completion/v172-work/finalize-evidence.py
      - name: Save verified checkpoint and evidence to work branch
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions@users.noreply.github.com"
          git add JLPT_N1_ukrainian_reading_v172.html completion/v172-work/prepare-results.json completion/v172-work/browser-results.json completion/v172-work/registry-results.json completion/v172-acceptance.tsv completion/v172-pair-review.tsv completion/review-register.csv
          if ! git diff --cached --quiet; then
            git commit -m "Save verified v172 C10 checkpoint and acceptance evidence"
            git push origin HEAD:work/v172-c10-followups
          fi
      - name: Publish verified v172 release to main
        if: success() && github.event_name == 'pull_request' && hashFiles('completion/v172-work/PUBLISH') != ''
        run: python3 completion/v172-work/publish-main.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v172-c10-audit-evidence
          path: |
            JLPT_N1_ukrainian_reading_v172.html
            completion/v172-work/prepare-results.json
            completion/v172-work/browser-results.json
            completion/v172-work/registry-results.json
            completion/v172-work/inspect-targets.json
            completion/v172-work/updates.json
            completion/v172-acceptance.tsv
            completion/v172-pair-review.tsv
          if-no-files-found: error

  verify-v173:
    if: (github.event_name == 'push' && github.ref_name == 'work/v173-c10-3761-3764') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'work/v173-c10-3761-3764')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v173-c10-3761-3764
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python and browser verifier syntax
        run: |
          python3 -m py_compile completion/v173-work/prepare.py completion/v173-work/finalize-evidence.py
          node --check completion/v173-work/browser.cjs
      - name: Reproduce v173 from the exact published v172 baseline
        run: python3 completion/v173-work/prepare.py
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify changed cards, all IDs, translations and progress
        run: node completion/v173-work/browser.cjs
      - name: Finalize acceptance and registry evidence
        run: python3 completion/v173-work/finalize-evidence.py
      - name: Save verified HTML and evidence to the work branch
        if: success() && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions@users.noreply.github.com"
          git add JLPT_N1_ukrainian_reading_v173.html completion/v173-work/prepare-results.json completion/v173-work/browser-results.json completion/v173-work/registry-results.json completion/v173-acceptance.tsv completion/review-register.csv
          if ! git diff --cached --quiet; then
            git commit -m "Save verified v173 C10 checkpoint and acceptance evidence"
            git push origin HEAD:work/v173-c10-3761-3764
          fi
      - name: Publish only the verified v173 release artifacts to main
        if: success() && github.event_name == 'pull_request' && hashFiles('completion/v173-work/PUBLISH') != ''
        run: python3 completion/v173-work/publish-main.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v173-c10-evidence
          path: |
            JLPT_N1_ukrainian_reading_v173.html
            completion/v173-work/prepare-results.json
            completion/v173-work/browser-results.json
            completion/v173-work/registry-results.json
            completion/v173-acceptance.tsv
          if-no-files-found: error

  verify-v174:
    if: (github.event_name == 'push' && github.ref_name == 'work/v174-c10-remaining-open-ids') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'work/v174-c10-remaining-open-ids')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v174-c10-remaining-open-ids
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python and browser verifier syntax
        run: |
          python3 -m py_compile completion/v174-work/prepare.py completion/v174-work/finalize-evidence.py
          node --check completion/v174-work/browser.cjs
      - name: Reproduce v174 from the exact published v173 baseline
        run: python3 completion/v174-work/prepare.py
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify four C10 cards, all IDs, translations and progress
        run: node completion/v174-work/browser.cjs
      - name: Finalize v174 acceptance and registry evidence
        run: python3 completion/v174-work/finalize-evidence.py
      - name: Save verified HTML and evidence to the work branch
        if: success() && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions@users.noreply.github.com"
          git add JLPT_N1_ukrainian_reading_v174.html completion/v174-work/prepare-results.json completion/v174-work/browser-results.json completion/v174-work/registry-results.json completion/v174-acceptance.tsv completion/review-register.csv
          if ! git diff --cached --quiet; then
            git commit -m "Save verified v174 C10 checkpoint and acceptance evidence"
            git fetch origin work/v174-c10-remaining-open-ids
            git rebase origin/work/v174-c10-remaining-open-ids
            git push origin HEAD:work/v174-c10-remaining-open-ids
          fi
      - name: Publish only verified v174 release artifacts to main
        if: success() && github.event_name == 'pull_request' && hashFiles('completion/v174-work/PUBLISH') != ''
        run: python3 completion/v174-work/publish-main.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v174-c10-evidence
          path: |
            JLPT_N1_ukrainian_reading_v174.html
            completion/v174-work/prepare-results.json
            completion/v174-work/browser-results.json
            completion/v174-work/registry-results.json
            completion/v174-acceptance.tsv
          if-no-files-found: error
