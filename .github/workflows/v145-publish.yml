name: Verify and publish JLPT N1 v145
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit145/**'
      - '.github/workflows/v145-publish.yml'
permissions:
  contents: write
concurrency:
  group: jlpt-v145-release
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact release and verify all authorized changes
        run: |
          git fetch --depth=1 origin 7c390b6eccb3eb7d75ed1ff1a5a4debac15fe742
          python3 audit145/build.py
          python3 audit145/check.py
          python3 audit145/coverage.py
          node --check audit145/app.js
      - name: Prepare Chromium and Japanese font
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify new grammar contexts and prior saved sets
        run: |
          node audit145/meaning-browser.cjs
          node audit145/coverage-browser.cjs
          node audit145/scope-browser.cjs
          node audit145/grammar-browser.cjs
      - name: Verify presentation, navigation, persistence and complete session
        run: |
          node audit145/presentation.cjs
          node audit145/ui.cjs
          node audit145/browser-functional.cjs
          node audit145/session-completion.cjs
          node audit145/comparison-browser.cjs
      - name: Publish complete HTML, audit and feedback evidence
        run: |
          python3 audit145/publish.py
          python3 audit145/check.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JLPT_N1_ukrainian_reading_v145.html JLPT_N1_v145_audit.md README.md PROJECT_STATUS.md completion/BACKLOG.md completion/C10-C18-v145-result.json audit145/build-summary.json audit145/editorial-review.json audit145/provenance.json audit145/grammar-coverage.json audit145/*-results.json completion/review-register.csv
          git commit -m "Release JLPT N1 v145: audit 34 grammar cards and 37 comparisons; retain all 325 prior author credits"
          git push origin HEAD:main
      - name: Verify published full release
        run: |
          git fetch origin main
          for file in JLPT_N1_ukrainian_reading_v145.html JLPT_N1_v145_audit.md README.md PROJECT_STATUS.md completion/BACKLOG.md completion/C10-C18-v145-result.json completion/review-register.csv; do
            test "$(git hash-object "$file")" = "$(git rev-parse "origin/main:$file")"
          done
