name: JLPT N1 v228 C10 review
on:
  push:
    branches: [work/v228-c10-next-pending]
    paths:
      - "completion/v228-work/trigger.txt"
permissions:
  contents: write
concurrency:
  group: jlpt-n1-v228-c10
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v228-c10-next-pending
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build candidate and update register
        run: node completion/v228-work/verify.cjs
      - name: Check JavaScript syntax
        run: |
          node --check completion/v228-work/verify.cjs
          node --check completion/v228-work/browser.cjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Chromium acceptance
        run: node completion/v228-work/browser.cjs
      - name: Mark technical acceptance and copy evidence
        if: success()
        run: |
          cp completion/v228-work/prepare-results.json completion/v228-prepare-results.json
          cp completion/v228-work/registry-results.json completion/v228-registry-results.json
          cp completion/v228-work/browser-results.json completion/v228-browser-results.json
          node - <<'NODE'
          const fs=require('node:fs');
          const p='completion/v228-work/checkpoint.json',d=JSON.parse(fs.readFileSync(p,'utf8'));
          d.technical_verification='passed';d.chromium_verification='passed';
          d.workflow_run_id=Number(process.env.GITHUB_RUN_ID);
          d.status='candidate prepared; Node syntax, deterministic rollback, Chromium and storage checks passed; ready for guarded publication';
          fs.writeFileSync(p,JSON.stringify(d,null,2)+'\\n');
          const a='JLPT_N1_v228_audit.md';
          fs.writeFileSync(a,fs.readFileSync(a,'utf8').replace('TECHNICAL_STATUS_PENDING','TECHNICAL_STATUS_PASS'));
          NODE
      - name: Save candidate and evidence to work branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions@users.noreply.github.com"
          git add JLPT_N1_ukrainian_reading_v228.html JLPT_N1_v228_audit.md completion/review-register.csv completion/v228-acceptance.tsv completion/v228-c10-review.tsv completion/v228-field-changes.tsv completion/v228-pair-review.tsv completion/v228-source-review.md completion/v228-work/checkpoint.json completion/v228-work/prepare-results.json completion/v228-work/registry-results.json completion/v228-work/browser-results.json completion/v228-work/rendered-debug.json completion/v228-work/verify.cjs completion/v228-work/browser.cjs completion/v228-work/preaudit-notes.md completion/v228-work/trigger.txt completion/v228-prepare-results.json completion/v228-registry-results.json completion/v228-browser-results.json
          git commit -m "Save v228 C10 author review and Chromium evidence"
          git push origin HEAD:work/v228-c10-next-pending
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jlpt-n1-v228-c10-evidence
          path: |
            JLPT_N1_ukrainian_reading_v228.html
            JLPT_N1_v228_audit.md
            completion/v228-acceptance.tsv
            completion/v228-c10-review.tsv
            completion/v228-field-changes.tsv
            completion/v228-pair-review.tsv
            completion/v228-source-review.md
            completion/v228-work/checkpoint.json
            completion/v228-work/prepare-results.json
            completion/v228-work/registry-results.json
            completion/v228-work/browser-results.json
            completion/v228-work/rendered-debug.json
