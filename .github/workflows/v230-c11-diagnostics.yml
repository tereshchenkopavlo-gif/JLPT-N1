name: JLPT N1 v230 C11 POS and meaning review
on:
  push:
    branches:
      - work/v230-reviewed-cloze-gate
    paths:
      - completion/v230-work/trigger.txt
  pull_request:
    branches:
      - main
    paths:
      - completion/v230-work/trigger.txt
permissions:
  contents: write
concurrency:
  group: jlpt-n1-v230-c11
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v230-reviewed-cloze-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce v230 from exact published v229
        run: |
          python3 -m py_compile completion/v230-work/prepare.py completion/v230-work/finalize.py
          python3 completion/v230-work/prepare.py
      - name: Check Chromium verifier
        run: node --check completion/v230-work/diagnose.cjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Collect POS, meaning quiz, pools, cards and progress diagnostics
        run: node completion/v230-work/diagnose.cjs
      - name: Preserve diagnostic outputs on work branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions@users.noreply.github.com"
          git add -f completion/v230-work/browser-results.json completion/v230-work/pool-impact.json completion/v230-work/meaning-quiz-diagnostics.json completion/v230-work/rendered-debug.json
          if ! git diff --cached --quiet; then
            git commit -m "Record v230 C11 browser diagnostics"
            git push origin HEAD:work/v230-reviewed-cloze-gate
          fi
      - name: Finalize author acceptance, registry and evidence
        run: python3 completion/v230-work/finalize.py
      - name: Save verified candidate and evidence to work branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions@users.noreply.github.com"
          git add JLPT_N1_ukrainian_reading_v230.html JLPT_N1_v230_audit.md completion/review-register.csv completion/v230-* completion/v230-work/
          git commit -m "Save v230 C11 POS and meaning review"
          git push origin HEAD:work/v230-reviewed-cloze-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jlpt-n1-v230-c11-review-evidence
          path: |
            JLPT_N1_ukrainian_reading_v230.html
            JLPT_N1_v230_audit.md
            completion/v230-work/
          if-no-files-found: warn
