name: C12 batch 22 browser
on:
  push:
    branches: [work/c12-batch22-checkpoint]
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 completion/c12-batch22/build-candidate.py
      - run: node completion/c12-batch22/browser.cjs
      - run: |
          f=JLPT_N1_ukrainian_reading_v229_C12x.html
          a=JLPT_N1_v229_C12x_audit.md
          candidate=completion/c12-batch22/JLPT_N1_C12_candidate_UNACCEPTED.html
          echo "ec99afb9fcd2e64463388d5b66ad2c80708d3b731aa7074f41c276bfb2d2e8b3  $candidate" | sha256sum -c -
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = 'ab20edf2cbf82f8df5c323b1625b5e30051f8a61'
          dest="$RUNNER_TEMP/release"
          git worktree add --detach "$dest" FETCH_HEAD
          mkdir -p "$dest/completion/c12-batch22"
          cp "$candidate" "$dest/$f"
          cp completion/c12-batch22/{drafts.json,build-candidate.py,browser.cjs,record-release.py,checkpoint.md,browser-results.json,integration-results.json} "$dest/completion/c12-batch22/"
          cd "$dest"
          cat > "$a" <<'EOF'
          # v229-C12x · партія 22 — 25 листопада 2026

          Додано 「直す前に残すもの」, повний український переклад і три питання. Банк містить 120 середніх і 76 довгих текстів. До цілі C12 залишилося чотири довгі текстів. Основний реєстр — 5970 позицій, словниковий аудит — 3897/3914.

          Авторський перегляд охопив зміст, переклад, ключі, альтернативи та буквальні опори. Збірка перевірила синтаксис JS, попередні тексти й побайтовий відкат. Chromium перевірив відображення, ключі й пояснення на 360, 412 і 1280 px. Незалежне мовне та фізичне приймання відкриті.

          SHA-256 HTML `ec99afb9fcd2e64463388d5b66ad2c80708d3b731aa7074f41c276bfb2d2e8b3`. Основа `ab20edf2cbf82f8df5c323b1625b5e30051f8a61`.
          EOF
          printf '\n[Журнал перевірок](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$a"
          cp "$a" completion/c12-batch22/acceptance.md
          python3 completion/c12-batch22/record-release.py
          printf '\nПоточний випуск C12 — [повний HTML](./%s) і [звіт](./%s).\n' "$f" "$a" >> README.md
          git add -- "$f" "$a" README.md PROJECT_STATUS.md completion/BACKLOG.md completion/review-register.csv completion/c12-batch22
          git diff --cached --check -- . ":(exclude)$f"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Release verified C12 batch 22'
          git push origin HEAD:refs/heads/main
