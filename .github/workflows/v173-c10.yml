name: JLPT N1 v173 manual verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jlpt-n1-v173-manual
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v173-c10-3761-3764
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce and syntax-check v173
        run: |
          python3 -m py_compile completion/v173-work/prepare.py completion/v173-work/finalize-evidence.py
          node --check completion/v173-work/browser.cjs
          python3 completion/v173-work/prepare.py
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Run Chromium regression
        run: node completion/v173-work/browser.cjs
      - name: Finalize acceptance evidence
        run: python3 completion/v173-work/finalize-evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v173-c10-manual-evidence
          path: |
            JLPT_N1_ukrainian_reading_v173.html
            completion/v173-work/prepare-results.json
            completion/v173-work/browser-results.json
            completion/v173-work/registry-results.json
            completion/v173-acceptance.tsv
          if-no-files-found: error
