name: JLPT N1 v153 candidate acceptance
on:
  push:
    branches: [work/vocab-audit-pilot]
    paths:
      - 'audit-pilot/**'
      - '.github/workflows/v153-pilot-acceptance.yml'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 audit-pilot/trial.py --out pilot-acceptance-output
          python3 audit-pilot/acceptance.py pilot-acceptance-output/trial-editorial.html
          node audit-pilot/follow-up.cjs pilot-acceptance-output/trial-editorial.html --meaning --editorial > pilot-acceptance-output/acceptance-engine.json
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - run: |
          node pilot-acceptance-output/vocab-browser.cjs
          node pilot-acceptance-output/session-completion.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v153-pilot-acceptance
          path: pilot-acceptance-output/acceptance-*.json
