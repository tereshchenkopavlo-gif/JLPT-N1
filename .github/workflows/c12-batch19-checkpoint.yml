name: C12 batch 19 browser
on:
  push:
    branches: [work/c12-batch19-checkpoint]
    paths: ['completion/c12-batch19/**', '.github/workflows/c12-batch19-checkpoint.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 completion/c12-batch19/build-candidate.py
      - run: node completion/c12-batch19/browser.cjs
