name: Verify and publish JLPT N1 v131
on:
  workflow_dispatch:
  push:
    paths:
      - 'audit131/**'
      - '.github/workflows/v131-publish.yml'
permissions:
  contents: write
concurrency:
  group: jlpt-v131-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build from exact v130 baseline and validate content preservation
        run: |
          python3 audit131/build.py
          python3 audit131/invariants.py
          python3 audit131/content-integrity.py
          node --check audit131/app.js
      - name: Prepare Chromium and Japanese font
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify all new readings, real session and progress roundtrip
        run: |
          node audit131/browser-smoke.cjs
          node audit131/readings-browser.cjs
          node audit131/browser-functional.cjs
          node audit131/session-completion.cjs
      - name: Publish complete versioned HTML, audit and current documentation
        run: |
          python3 audit131/publish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JLPT_N1_ukrainian_reading_v131.html JLPT_N1_v131_audit.md README.md PROJECT_STATUS.md audit131/coverage.json audit131/build-summary.json audit131/invariant-results.json audit131/content-integrity-results.json audit131/readings-browser-results.json
          git commit -m "Release JLPT N1 v131: 118 readings and 283 questions"
          git push origin HEAD:main
      - name: Verify remote full HTML and audit blob digests
        run: |
          git fetch origin main
          test "$(git hash-object JLPT_N1_ukrainian_reading_v131.html)" = "$(git rev-parse origin/main:JLPT_N1_ukrainian_reading_v131.html)"
          test "$(git hash-object JLPT_N1_v131_audit.md)" = "$(git rev-parse origin/main:JLPT_N1_v131_audit.md)"
