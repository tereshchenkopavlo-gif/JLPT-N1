name: JLPT N1 v172 C10 inspection
on:
  push:
    branches: [work/v172-c10-followups]
    paths:
      - 'completion/v172-work/inspect-targets.py'
      - '.github/workflows/v172-c10.yml'
  pull_request:
    branches: [main]
    paths:
      - 'completion/v172-work/inspect-targets.py'
      - '.github/workflows/v172-c10.yml'
permissions:
  contents: write
concurrency:
  group: jlpt-n1-v172-c10-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v172-c10-followups
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract exact target records from v171
        run: python3 completion/v172-work/inspect-targets.py
      - name: Save inspection evidence to work branch
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions@users.noreply.github.com"
          git add completion/v172-work/inspect-targets.json
          if ! git diff --cached --quiet; then
            git commit -m "Save exact C10 target data inspection"
            git push origin HEAD:work/v172-c10-followups
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v172-c10-target-inspection
          path: completion/v172-work/inspect-targets.json
          if-no-files-found: error
