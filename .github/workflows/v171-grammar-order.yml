name: Verify JLPT N1 v171 grammar order (PR)
on:
  push:
    branches: [work/v171-grammar-order-checkpoint]
    paths:
      - 'completion/v171-work/**'
      - '.github/workflows/v171-grammar-order.yml'
      - 'PROJECT_STATUS.md'
      - 'completion/BACKLOG.md'
  pull_request:
    branches: [main]
    paths:
      - 'completion/v171-work/**'
      - '.github/workflows/v171-grammar-order.yml'
      - 'PROJECT_STATUS.md'
      - 'completion/BACKLOG.md'
permissions:
  contents: read
concurrency:
  group: jlpt-v171-grammar-order-pr
  cancel-in-progress: false
jobs:
  grammar-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v171-grammar-order-checkpoint
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce exact checkpoint from main v170
        run: python3 completion/v171-work/prepare-checkpoint.py
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify all grammar display paths
        run: node completion/v171-work/grammar-order-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v171-grammar-order-pr-evidence
          path: |
            completion/v171-work/prepare-results.json
            completion/v171-work/grammar-order-results.json
            JLPT_N1_v171_checkpoint.html
          if-no-files-found: error
