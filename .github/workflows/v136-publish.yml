name: Verify and publish JLPT N1 v136
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit136/**'
      - '.github/workflows/v136-publish.yml'
permissions:
  contents: write
concurrency:
  group: jlpt-v136-release
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build from exact v135 and preserve all learning data
        run: |
          python3 audit136/build.py
          python3 audit136/check.py
          node --check audit136/app.js
      - name: Prepare Chromium and Japanese font
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify POS, formatting, navigation, comparison and progress
        run: |
          node audit136/presentation.cjs
          node audit136/ui.cjs
          node audit136/browser-functional.cjs
          node audit136/session-completion.cjs
      - name: Publish full HTML and audit after successful gate
        run: |
          python3 audit136/publish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JLPT_N1_ukrainian_reading_v136.html JLPT_N1_v136_audit.md README.md PROJECT_STATUS.md completion/BACKLOG.md audit136/build-summary.json audit136/invariant-results.json audit136/presentation-results.json audit136/ui-results.json audit136/functional-results.json audit136/session-results.json audit136/pos.json
          git commit -m "Release JLPT N1 v136: POS filter and consistent readable card structure"
          git push origin HEAD:main
      - name: Verify published HTML, audit and current docs
        run: |
          git fetch origin main
          test "$(git hash-object JLPT_N1_ukrainian_reading_v136.html)" = "$(git rev-parse origin/main:JLPT_N1_ukrainian_reading_v136.html)"
          test "$(git hash-object JLPT_N1_v136_audit.md)" = "$(git rev-parse origin/main:JLPT_N1_v136_audit.md)"
          test "$(git hash-object README.md)" = "$(git rev-parse origin/main:README.md)"
          test "$(git hash-object PROJECT_STATUS.md)" = "$(git rev-parse origin/main:PROJECT_STATUS.md)"
