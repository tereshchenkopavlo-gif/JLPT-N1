name: C12 thirteenth batch integration
on:
  push:
    branches: [work/c12-batch13-checkpoint]
    paths: [completion/c12-batch13/**, .github/workflows/c12-batch13.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python completion/c12-batch13/build-candidate.py
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node completion/c12-batch13/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c12-batch13-checkpoint
          path: |
            completion/c12-batch13/JLPT_N1_C12_candidate_UNACCEPTED.html
            completion/c12-batch13/*results.json
