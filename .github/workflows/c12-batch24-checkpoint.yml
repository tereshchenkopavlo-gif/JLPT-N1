name: C12 batch 24 browser
on:
  push:
    branches: [work/c12-batch24-checkpoint]
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 completion/c12-batch24/build-candidate.py
      - run: node completion/c12-batch24/browser.cjs
      - run: |
          f=JLPT_N1_ukrainian_reading_v229_C12z.html
          a=JLPT_N1_v229_C12z_audit.md
          candidate=completion/c12-batch24/JLPT_N1_C12_candidate_UNACCEPTED.html
          echo "4ef2dd12ecb254bad6f3173f2b3be5390de06f295fe64a414e45f64c0ee77aed  $candidate" | sha256sum -c -
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = '29190ad01f5fb8f5036107456529cc8031afd04c'
          dest="$RUNNER_TEMP/release"
          git worktree add --detach "$dest" FETCH_HEAD
          mkdir -p "$dest/completion/c12-batch24"
          cp "$candidate" "$dest/$f"
          cp completion/c12-batch24/{drafts.json,build-candidate.py,browser.cjs,record-release.py,checkpoint.md,browser-results.json,integration-results.json} "$dest/completion/c12-batch24/"
          cd "$dest"
          cat > "$a" <<'EOF'
          # v229-C12z · партія 24 — 26 листопада 2026

          Додано 「合わせない色が伝えること」, повний український переклад і три питання. Банк містить 120 середніх і 78 довгих текстів. До цілі C12 залишилося два довгі тексти. Основний реєстр — 5978 позицій, словниковий аудит — 3897/3914.

          Авторський перегляд охопив зміст, переклад, ключі, альтернативи та буквальні опори. Збірка перевірила синтаксис JS, попередні тексти й побайтовий відкат. Chromium перевірив відображення, ключі й пояснення на 360, 412 і 1280 px.  Незалежне мовне приймання цієї партії та перевірка на фізичних пристроях відкриті.

          SHA-256 HTML `4ef2dd12ecb254bad6f3173f2b3be5390de06f295fe64a414e45f64c0ee77aed`. Основа `29190ad01f5fb8f5036107456529cc8031afd04c`.
          EOF
          printf '\n[Журнал перевірок](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$a"
          cp "$a" completion/c12-batch24/acceptance.md
          python3 completion/c12-batch24/record-release.py
          printf '\nПоточний випуск C12 — [повний HTML](./%s) і [звіт](./%s).\n' "$f" "$a" >> README.md
          git add -- "$f" "$a" README.md PROJECT_STATUS.md completion/BACKLOG.md completion/review-register.csv completion/c12-batch24
          git diff --cached --check -- . ":(exclude)$f"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Release verified C12 batch 24'
          git push origin HEAD:refs/heads/main
