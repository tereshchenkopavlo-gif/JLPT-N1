name: Verify and publish JLPT N1 v151
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit151/**'
      - '.github/workflows/v151-publish.yml'
permissions:
  contents: write
concurrency:
  group: jlpt-v151-release
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact release and verify all authorized changes
        run: |
          git fetch --depth=1 origin 9c8641ab6c9d352bd021499d10bb037f9e66cda3
          python3 audit151/build.py
          python3 audit151/check.py
          python3 audit151/coverage.py
          node --check audit151/app.js
      - name: Prepare Chromium and Japanese font
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify new grammar contexts and prior saved sets
        run: |
          node audit151/meaning-browser.cjs
          node audit151/coverage-browser.cjs
          node audit151/scope-browser.cjs
          node audit151/vocab-browser.cjs
      - name: Verify presentation, navigation, persistence and complete session
        run: |
          node audit151/presentation.cjs
          node audit151/ui.cjs
          node audit151/browser-functional.cjs
          node audit151/session-completion.cjs
          node audit151/comparison-browser.cjs
      - name: Publish complete HTML, audit and feedback evidence
        run: |
          python3 audit151/publish.py
          python3 audit151/check.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JLPT_N1_ukrainian_reading_v151.html JLPT_N1_v151_audit.md README.md PROJECT_STATUS.md completion/BACKLOG.md completion/C10-C18-v151-result.json audit151/build-summary.json audit151/editorial-review.json audit151/provenance.json audit151/grammar-coverage.json audit151/*-results.json completion/review-register.csv
          git commit -m "Release JLPT N1 v151: audit vocabulary cards 31–60; retain all 577 prior author credits"
          git push origin HEAD:main
      - name: Verify published full release
        run: |
          git fetch origin main
          for file in JLPT_N1_ukrainian_reading_v151.html JLPT_N1_v151_audit.md README.md PROJECT_STATUS.md completion/BACKLOG.md completion/C10-C18-v151-result.json completion/review-register.csv; do
            test "$(git hash-object "$file")" = "$(git rev-parse "origin/main:$file")"
          done
