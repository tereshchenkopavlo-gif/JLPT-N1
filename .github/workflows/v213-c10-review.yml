name: JLPT N1 v213 C10 author review

on:
  push:
    branches: [work/v213-c10-next-pending]
    paths:
      - "completion/v213-work/**"
      - ".github/workflows/v213-c10-review.yml"
  pull_request:
    branches: [main]
    paths:
      - "completion/v213-work/**"
      - ".github/workflows/v213-c10-review.yml"

permissions:
  contents: write

concurrency:
  group: jlpt-n1-v213-c10
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v213-c10-next-pending
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build deterministic v213 candidate and registry
        run: set -o pipefail; python3 completion/v213-work/apply.py 2>&1 | tee completion/v213-work/apply-error.txt

      - name: Check Python and Node syntax
        run: |
          python3 -m py_compile completion/v213-work/apply.py completion/v213-work/publish.py
          node --check completion/v213-work/browser.cjs

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run Chromium acceptance
        run: node completion/v213-work/browser.cjs

      - name: Copy canonical evidence files
        if: success()
        run: |
          cp completion/v213-work/prepare-results.json completion/v213-prepare-results.json
          cp completion/v213-work/registry-results.json completion/v213-registry-results.json
          cp completion/v213-work/browser-results.json completion/v213-browser-results.json
          cp completion/v213-work/pos-diagnostic.json completion/v213-pos-diagnostic.json

      - name: Mark checkpoint after successful Chromium acceptance
        if: success()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("completion/v213-work/checkpoint.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          d["status"] = "author review complete; deterministic candidate and Chromium verification passed; exact-artifact publication pending"
          d["chromium_verification"] = "passed"
          d["browser_results"] = "completion/v213-work/browser-results.json"
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Save candidate and evidence to work branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions@users.noreply.github.com"
          git add JLPT_N1_ukrainian_reading_v213.html completion/review-register.csv completion/v213-work/checkpoint.json completion/v213-work/prepare-results.json completion/v213-work/registry-results.json completion/v213-work/browser-results.json completion/v213-work/pos-diagnostic.json completion/v213-prepare-results.json completion/v213-registry-results.json completion/v213-browser-results.json completion/v213-pos-diagnostic.json
          if git diff --cached --quiet; then
            echo "No generated changes to save."
          else
            git commit -m "Save v213 deterministic and Chromium evidence"
            git push origin HEAD:work/v213-c10-next-pending
          fi

      - name: Publish only exact verified artifacts to main (no bulk branch merge)
        if: success()
        run: python3 completion/v213-work/publish.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jlpt-n1-v213-c10-evidence
          path: |
            JLPT_N1_ukrainian_reading_v213.html
            JLPT_N1_v213_audit.md
            completion/v213-acceptance.tsv
            completion/v213-c10-review.tsv
            completion/v213-field-changes.tsv
            completion/v213-source-review.md
            completion/v213-deferred.tsv
            completion/v213-pos-diagnostic.json
            completion/v213-work/checkpoint.json
            completion/v213-work/prepare-results.json
            completion/v213-work/registry-results.json
            completion/v213-work/browser-results.json
            completion/v213-work/apply.py
            completion/v213-work/browser.cjs
            completion/v213-work/publish.py
            completion/v213-work/apply-error.txt
